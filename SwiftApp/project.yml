name: GitHubTray
options:
  bundleIdPrefix: com.github-tray
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    PRODUCT_NAME: GitHubTray
    PRODUCT_BUNDLE_IDENTIFIER: com.github-tray.app
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    INFOPLIST_FILE: GitHubTray/Info.plist

targets:
  GitHubTray:
    type: application
    platform: macOS
    sources:
      - path: GitHubTray/Sources
        excludes:
          - "**/.DS_Store"
          - "github_tray_core.swift"
      - path: GitHubTray/Resources
        buildPhase: resources
        excludes:
          - "**/.DS_Store"
      - path: GitHubTray/Generated/github_tray_core.swift
        optional: true
        type: file
    settings:
      base:
        INFOPLIST_FILE: GitHubTray/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.github-tray.app
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/GitHubTray/github_tray_core.xcframework/macos-arm64"
        OTHER_LDFLAGS:
          - "-lgithub_tray_core"
          - "-framework"
          - "Cocoa"
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "Security"
          - "-liconv"
        SWIFT_INCLUDE_PATHS:
          - "$(SRCROOT)/GitHubTray/Generated"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/GitHubTray/Generated"
    entitlements:
      path: GitHubTray/GitHubTray.entitlements
      properties:
        com.apple.security.app-sandbox: false
